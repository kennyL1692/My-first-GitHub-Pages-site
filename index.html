<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Site</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .terminal {
      width: 100%;
      max-width: 600px;
    }

    .prompt {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .prompt-symbol {
      color: #ff79c6;
      font-weight: 700;
      font-size: 1rem;
    }

    h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      display: inline;
    }

    .output {
      padding-left: 1.25rem;
      border-left: 2px solid #222;
    }

    p {
      font-size: 0.9rem;
      color: #888;
      line-height: 1.8;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: #e0e0e0;
      margin-left: 3px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="prompt">
      <span class="prompt-symbol">~$</span>
      <h1>Hello, world!</h1>
    </div>
    <div class="output">
      <p>My first GitHub and Cloudflare Pages site.<span class="cursor"></span></p>
    </div>
  </div>
</body>
</html>
